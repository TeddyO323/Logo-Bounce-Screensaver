<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD Logo Bounce</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dvd-logo" class="color-transition">
        <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="120" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
            <text x="60" y="38" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="currentColor">DVD</text>
        </svg>
    </div>
    
    <div id="corner-hit">Corner hits: 0</div>
<div id="controls" class="floating">
    <div class="title">DVD Logo Bounce</div>

    <button class="control-btn" id="add-logo">
        Add Logo <span class="key-hint">+</span>
    </button>

    <button class="control-btn" id="remove-logo">
        Remove Logo <span class="key-hint">−</span>
    </button>

    <button class="control-btn" id="add-trails">
        Add Trails
    </button>

    <button class="control-btn" id="clear-trails">
        Clear Trails
    </button>

    <button class="control-btn" id="speed-up">
        Speed + <span class="key-hint">↑</span>
    </button>

    <button class="control-btn" id="slow-down">
        Speed − <span class="key-hint">↓</span>
    </button>

    <button class="control-btn" id="fullscreen-toggle">
        Full Screen <span class="key-hint">F</span>
    </button>

    <button class="control-btn danger" id="hide-controls">
        Hide Controls <span class="key-hint">H</span>
    </button>
</div>

<button id="show-controls" style="display:none;">
    Show Controls <span class="key-hint">H</span>
</button>

    <script src="script.js"></script>
</body>
</html>
